name: Frontend CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'starter/frontend/**'
  workflow_dispatch: # Allows manual triggering

env:
  AWS_REGION: us-east-1 # Change to your ECR region
  ECR_REPOSITORY: movie-catalog-frontend # Change to your ECR repository name

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: CI=true npm test

  build-and-push:
    name: Build and Push to ECR
    needs: [test] # Run after tests succeed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build, tag, and push image to Amazon ECR
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }} # Tag the built docker image with the git sha
          REACT_APP_MOVIE_API_URL: http://localhost:5000
        run: |
          # Build the docker image
          docker build --build-arg=REACT_APP_MOVIE_API_URL=$REACT_APP_MOVIE_API_URL -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # Push the docker image
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Optional: tag as latest and push
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-to-k8s:
    name: Deploy to Kubernetes
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Kubectl
      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # Configure Kubeconfig (adjust for EKS or your specific cluster)
      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # Apply Kubernetes manifests using kustomize
      - name: Update and apply Kubernetes manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_URL: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          cd starter/frontend/k8s
          
          # Set the image tag to the newer version
          kustomize edit set image frontend=$ECR_URL/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Apply the manifests to the cluster
          kustomize build | kubectl apply -f -
          
          # Verify deployment
          kubectl rollout status deployment/frontend -n movie-catalog
