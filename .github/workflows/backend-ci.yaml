name: Backend Continuous Integration

# This workflow runs automatically on every pull request to the main branch
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  # The lint job checks the backend code for style and syntax issues using flake8
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # Caching pipenv virtual environments speeds up consecutive runs
      - name: Cache pipenv virtualenvs
        uses: actions/cache@v3
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-v2-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-v2-
      
      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --dev
      
      # Running the linter to catch any syntax errors
      - name: Run Linter
        run: pipenv run lint

  # The test job runs our backend unit tests to ensure API endpoints work correctly
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pipenv virtualenvs
        uses: actions/cache@v3
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-v2-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-v2-
      
      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --dev
      
      # Run backend tests
      - name: Run Tests
        run: pipenv run test

  # The build job verifies that the Flask application can be successfully containerized
  build:
    name: Build Backend
    # Use the 'needs' directive to ensure this job only runs AFTER linting and testing succeed
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pipenv virtualenvs
        uses: actions/cache@v3
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-v2-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-v2-
      
      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --dev
      
      # Build the Docker image
      - name: Build Docker image
        run: docker build -t backend-app .
