name: Backend Continuous Deployment

# Automatically trigger deployment when code is merged or pushed to main
on:
  push:
    branches: [ "main" ]
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  # The lint job checks the backend code for style and syntax issues
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # Use caching to speed up pipeline execution times
      - name: Cache pipenv virtualenvs
        uses: actions/cache@v3
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-v2-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-v2-
      
      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --dev
      
      # Run linter (must pass to proceed)
      - name: Run Linter
        run: pipenv run lint

  # The test job runs backend tests to verify application functionality
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pipenv virtualenvs
        uses: actions/cache@v3
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-v2-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-v2-
      
      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --dev
      
      # Run tests (must pass to proceed)
      - name: Run Tests
        run: pipenv run test

  # This job builds the Docker image and deploys it to the Kubernetes cluster
  build-and-deploy:
    name: Build, Push, and Deploy
    # This 'needs' directive guarantees that the docker image is only built AFTER linting and testing complete successfully
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log into AWS securely using Github Secrets so no credentials are hardcoded in the pipeline
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Uses a 3rd party action to log into ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Builds the docker image and pushes it to ECR
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Decodes the KUBE_CONFIG_DATA secret so kubectl can authenticate with the cluster
      - name: Set up kubecfg
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config
        
      # Deploys the application using kubectl and kustomize to set the new image tag
      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd k8s
          kustomize edit set image backend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          kustomize build | kubectl apply -f -
