name: CD Pipeline

on:
  push:
    branches: [ "main" ]
  # We want CD to run only when code is pushed to main and CI passes.
  # If CI and CD are in separate files, you might use 'workflow_run' or keep them in the same file.
  # For simplicity, we assume this triggers on push to main.

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}, ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}, ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest

  deploy-to-k8s:
    name: Deploy to Kubernetes
    needs: build-and-push-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Example for authenticating with K8s cluster (adjust based on your cloud provider e.g. AWS EKS, GCP GKE, Azure AKS)
      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
          
      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # Deploy the new images to the cluster
      - name: Update deployment images
        run: |
          cd k8s
          # Assuming you have k8s manifest files deployment-frontend.yaml and deployment-backend.yaml
          # Replace the placeholder images with the new ones
          kubectl set image deployment/frontend-deployment frontend=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} -n movie-catalog
          kubectl set image deployment/backend-deployment backend=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} -n movie-catalog

      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status deployment/frontend-deployment -n movie-catalog
          kubectl rollout status deployment/backend-deployment -n movie-catalog

  notify:
    name: Slack Notification
    needs: [build-and-push-images, deploy-to-k8s]
    runs-on: ubuntu-latest
    if: always() # Run regardless of success or failure
    
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
